[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-transcript"
version = "0.1.0"
description = "Resilient URL→transcript CLI for TikTok, YouTube, and Instagram (FluidAudio Parakeet + whisper.cpp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dustindog101" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
url-transcript = "url_transcript.cli:main"
ut = "url_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
url_transcript = ["py.typed"]
